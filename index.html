<!DOCTYPE html>

<head>

<title>WAO CARGO — Dispatching &amp; Carrier Support | USA &amp; Canada</title>
<meta name="description" content="WAO CARGO finds loads, negotiates rates and handles the back office for owner-operators and small fleets — hotshots, box trucks, dry vans, flatbeds and reefers — in the USA and Canada. English, Spanish, French.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SUSE:wght@400;600;700;800&display=swap" rel="stylesheet">

<body>
<!-- Splash / language gateway: cargo-banner background, centered logo, 3 language flags -->
<main class="splash">

  <nav class="splash-langs" aria-label="Choose your language">
    <a href="home.html?lang=en"><img src="assets/icon1.svg" alt="English"><span>EN</span></a>
    <a href="home.html?lang=fr"><img src="assets/icon2.svg" alt="Français"><span>FR</span></a>
    <a href="home.html?lang=es"><img src="assets/icon3.svg" alt="Español"><span>ES</span></a>

<div class="cookie-banner" id="cookie-banner" style="display:none">
  <p data-i18n="cookie_text">We use cookies to improve your visit. Non-essential cookies stay off unless you accept.</p>
  <div class="cookie-actions">
    <button type="button" class="btn btn-primary" id="cookie-accept" data-i18n="cookie_accept">Accept</button>
    <button type="button" class="btn btn-secondary" id="cookie-decline" data-i18n="cookie_decline">Decline</button>
